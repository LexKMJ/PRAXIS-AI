<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Praxis · Iniciar sesión</title>
<link rel="icon" href="/static/praxis.png">
<meta name="theme-color" content="#14131f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=DM+Sans:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14131f; --panel: #24233a; --panel2: #2f2e4a; --borde: #2d2c40; --text: #fff;
    --muted: #a1a1a6; --accent: #8b85ff; --error: #ff8a80;
    --serif: "Fraunces", Georgia, serif; --sans: "DM Sans", system-ui, sans-serif; --mano: "Caveat", cursive;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 20px; color: var(--text);
    font-family: var(--sans); line-height: 1.5; -webkit-font-smoothing: antialiased;
    background: radial-gradient(70% 45% at 50% 0%, rgba(79,70,229,.38), transparent 70%),
                linear-gradient(180deg, #1c1b4d 0%, #14131f 55%, #0e0d17 100%) fixed;
  }
  .tarjeta {
    width: 100%; max-width: 410px; text-align: center; padding: 34px 28px 28px;
    background: var(--panel); border: 1px solid var(--borde); border-radius: 28px;
    box-shadow: 0 24px 60px rgba(0,0,0,.4); animation: sube .6s ease both;
  }
  @keyframes sube { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  .logo { width: 60px; height: 60px; border-radius: 18px; margin: 0 auto 14px; background: url("/static/praxis.png") center / cover no-repeat #4f46e5; }
  .mano { margin: 0; font-family: var(--mano); font-weight: 700; font-size: 24px; color: var(--accent); transform: rotate(-2deg); display: inline-block; }
  h1 { margin: 0 0 6px; font-family: var(--serif); font-weight: 400; font-size: 34px; letter-spacing: -.02em; }
  h1 em { color: var(--accent); font-weight: 600; }
  .sub { margin: 0 0 22px; color: var(--muted); font-size: 15px; }
  form { text-align: left; display: flex; flex-direction: column; gap: 14px; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; }
  label[hidden] { display: none; }
  input {
    font: inherit; font-weight: 400; padding: 13px 16px; border-radius: 14px; color: var(--text);
    border: 1px solid var(--borde); background: #1b1a2d;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  #error { min-height: 20px; margin: 0; font-size: 14px; color: var(--error); }
  .pill {
    font: inherit; font-weight: 600; padding: 14px 22px; border: 0; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; text-decoration: none; transition: transform .2s, background .2s;
  }
  .pill:hover { transform: translateY(-2px); }
  .claro { background: #fff; color: #0b0b0c; }
  .claro:hover { background: #e3e3e6; }
  .oscuro { background: var(--panel2); color: var(--text); width: 100%; }
  .oscuro:hover { background: #3a3960; }
  #ir:disabled { opacity: .55; cursor: wait; }
  .o { display: flex; align-items: center; gap: 12px; margin: 18px 0 14px; color: var(--muted); font-size: 13px; }
  .o::before, .o::after { content: ""; flex: 1; height: 1px; background: var(--borde); }
  .nota { margin: 10px 0 0; color: var(--muted); font-size: 13px; }
  .cambio { margin: 18px 0 0; font-size: 14px; color: var(--muted); }
  #cambiar { font: inherit; background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; cursor: pointer; }
  a.volver { display: inline-block; margin-top: 16px; color: var(--muted); font-size: 14px; text-decoration: none; }
  a.volver:hover { color: var(--text); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { .tarjeta { animation: none; } }
</style>
</head>
<body>
<main class="tarjeta">
  <div class="logo"></div>
  <p class="mano">¡qué bueno verte!</p>
  <h1 id="titulo">Inicia <em>sesión</em></h1>
  <p class="sub" id="sub">Entra para continuar tus conversaciones y tu racha.</p>
  <form id="form" novalidate>
    <label id="l-nombre" hidden>Nombre
      <input id="nombre" maxlength="40" autocomplete="name">
    </label>
    <label>Correo electrónico
      <input id="email" type="email" autocomplete="email" maxlength="200" required>
    </label>
    <label>Contraseña
      <input id="clave" type="password" autocomplete="current-password" maxlength="128" required>
    </label>
    <p id="error" role="alert"></p>
    <button id="ir" class="pill claro" type="submit">Entrar</button>
  </form>
  <div class="o">o</div>
  <a class="pill oscuro" href="/invitado">Continuar como invitado</a>
  <p class="nota">Sin cuenta puedes chatear y jugar. Tu historial y tu racha se guardan solo en este dispositivo.</p>
  <p class="cambio"><span id="txt-cambio">¿Aún no tienes cuenta?</span> <button type="button" id="cambiar">Crear cuenta</button></p>
  <a class="volver" href="/">← Volver al inicio</a>
</main>
<script>
  let modo = "login";
  const $ = (id) => document.getElementById(id);

  function aplicarModo() {
    const reg = modo === "registro";
    $("titulo").innerHTML = reg ? "Crea tu <em>cuenta</em>" : "Inicia <em>sesión</em>";
    $("sub").textContent = reg ? "Guarda tus conversaciones y tu racha en tu cuenta."
                               : "Entra para continuar tus conversaciones y tu racha.";
    $("l-nombre").hidden = !reg;
    $("clave").autocomplete = reg ? "new-password" : "current-password";
    $("ir").textContent = reg ? "Crear cuenta" : "Entrar";
    $("txt-cambio").textContent = reg ? "¿Ya tienes cuenta?" : "¿Aún no tienes cuenta?";
    $("cambiar").textContent = reg ? "Inicia sesión" : "Crear cuenta";
    $("error").textContent = "";
  }
  $("cambiar").addEventListener("click", () => { modo = modo === "login" ? "registro" : "login"; aplicarModo(); });

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const reg = modo === "registro";
    const cuerpo = { email: $("email").value.trim(), clave: $("clave").value };
    if (reg) cuerpo.nombre = $("nombre").value.trim();
    $("error").textContent = "";
    $("ir").disabled = true;
    try {
      const r = await fetch(reg ? "/api/registro" : "/api/login", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(cuerpo)
      });
      const d = await r.json();
      if (r.ok) { location.href = "/app"; return; }
      $("error").textContent = d.error || "No se pudo completar la solicitud.";
    } catch (err) {
      $("error").textContent = "No se pudo conectar con el servidor. Inténtalo de nuevo.";
    }
    $("ir").disabled = false;
  });
</script>
</body>
</html>
